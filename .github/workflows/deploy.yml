name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PORT: 5173
          BASE_PATH: '/cricket-scoreboard/'
        run: npm run build

      - name: Create 404 fallback
        run: |
          cp dist/public/index.html dist/public/404.html

      - name: Generate static copies for routes
        run: |
          mkdir -p dist/public/display
          cp dist/public/index.html dist/public/display/index.html
          mkdir -p dist/public/display/break
          cp dist/public/index.html dist/public/display/break/index.html
          mkdir -p dist/public/display/target
          cp dist/public/index.html dist/public/display/target/index.html
          mkdir -p dist/public/display/result
          cp dist/public/index.html dist/public/display/result/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
