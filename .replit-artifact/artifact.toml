kind = "web"
previewPath = "/"
title = "Cricket Scoreboard"
version = "1.0.0"
id = "artifacts/cricket-scoreboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21424

[services.development]
run = "pnpm --filter @workspace/cricket-scoreboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cricket-scoreboard", "run", "build" ]
publicDir = "artifacts/cricket-scoreboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21424"
BASE_PATH = "/"
